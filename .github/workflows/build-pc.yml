name: Build Windows app

# Builds the desktop installer on a Windows machine (plan section 15, Phase 10).
# Download it from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pc
      - uses: actions/upload-artifact@v4
        with:
          name: LowFront-Setup-windows
          path: release/LowFront-Setup-*.exe
          if-no-files-found: error
